<div class="min-h-screen bg-red-100 font-sans pb-12">
    
    <div class="w-full h-56 md:h-72 bg-cover bg-center shadow-inner relative" 
         style="background-image: url('https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=2070&auto=format&fit=crop');">
        <div class="absolute inset-0 bg-black bg-opacity-60 flex flex-col items-center justify-center">
            <h1 class="text-4xl md:text-6xl font-black text-white tracking-widest drop-shadow-lg uppercase mb-2">
                Pizzería
            </h1>
            <p class="text-red-500 font-bold tracking-widest uppercase text-sm">Calidad y Sabor</p>
        </div>
    </div>
    <div class="container mx-auto px-4 md:px-8 -mt-16 relative z-10">
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-8 border-t-4 border-red-600">
            <app-captura-pedido (AgregarPizza)="recibirPizza($event)"></app-captura-pedido>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-xl p-6 border-t-4 border-gray-800">
                <app-detalle-pedido [listaPizzas]="pedidoActual"
                (GuardarPedido)="guardarPedidoCompleto($event)"></app-detalle-pedido>
            </div>
            <div class="lg:col-span-1 bg-white rounded-2xl shadow-xl p-6 border-t-4 border-red-600">
                <app-resume-ventas></app-resume-ventas>
            </div>

        </div>
    </div>
</div>
